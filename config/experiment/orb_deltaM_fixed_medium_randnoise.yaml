# Experiment: all groups get a fixed per-group medium miscalibration (from file) plus
# small random noise added on top each batch (T_combined = T_random @ T_base).
# Uses 6x6 delta_m (not delta_m_full).
# Run: python main.py experiment=orb_deltaM_fixed_medium_randnoise

predict_extrinsics: true
extrinsics_prediction_mode: delta_m
dynamic_rope_from_camtoken: true

orbital_miscal_noise_level: medium
miscal_max_angle_deg: 3.0
miscal_max_translation_m: 0.01
