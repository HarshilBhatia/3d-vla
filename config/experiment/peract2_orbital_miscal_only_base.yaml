# Persistent per-group calibration error only: no perturbation noise, no view alignment, from scratch.
dataset: OrbitalPeract2
bimanual: true
visual_num_history: 3
batch_size: 256
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
train_iters: 250000

miscal_mode: group
miscal_group_level: medium
miscal_cameras: [0, 1]

# Already the defaults, but stated because they define this arm.
view_align_mode: none
layerwise_view_align: false
perturbation_noise_rot_deg: null
perturbation_noise_trans_m: null
