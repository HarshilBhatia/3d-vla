# Vid-DeltaM-Refine, full-patch, 3D RoPE on history patches from their miscalibrated xyz.
dataset: OrbitalPeract2
model_type: denoise3d
bimanual: true
backbone: siglip2
text_backbone: null
visual_num_history: 5
proprio_num_history: 3
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: true
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 64
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
wd: 0.005
train_iters: 200000
head_positional_encoding: rope3d
view_align_mode: rope_6d
view_align_cameras: [0, 1]
layerwise_view_align: true
miscal_mode: group
miscal_group_level: medium
miscal_group_file: instructions/orbital_miscalibration_noise_bimanual_external_only.json
miscal_cameras: [0, 1]
perturbation_noise_rot_deg: 3.0
perturbation_noise_trans_m: 0.01
video_deltam: true
video_deltam_depth: 4
video_deltam_max_cameras: 4
video_deltam_full_image: true
video_deltam_patch_rope3d: true
interm_ckpt_interval_steps: 10000
checkpoint_evals:
  - recipe: instructions/eval_plans/vid_deltam_refine_fullpatch_rope3d_checkpoint_ladder_v01.json
    method_id: vid-deltaM-refine-fullpatch-rope3d
    min_step: 50000
    max_step: 200000
