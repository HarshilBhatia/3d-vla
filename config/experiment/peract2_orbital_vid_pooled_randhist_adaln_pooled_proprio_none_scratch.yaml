# Exp 5b: exp 1b's recipe with no scene context in the proprio encoder (an MLP on the gripper state), the control for 5a.
dataset: OrbitalPeract2
model_type: denoise3d
bimanual: true
backbone: siglip2
text_backbone: null
visual_num_history: 5
proprio_num_history: 3
visual_history_sampling: random
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: true
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 128
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
wd: 0.005
train_iters: 200000
head_positional_encoding: rope3d
view_align_mode: none
view_align_cameras: [0, 1]
layerwise_view_align: true
miscal_cameras: [0, 1]
video_deltam: true
video_deltam_depth: 4
video_deltam_max_cameras: 4
video_deltam_full_image: false
video_deltam_time_embedding: false
camera_adaln: pooled
proprio_context: none
checkpoint_evals:
  - recipe: instructions/eval_plans/robustness_ladder_ema_v01.json
    method_id: exp5b-proprio-none-ema
    min_step: 100000
  - recipe: instructions/eval_plans/sbrs_sanity_ladder_ema_v01.json
    method_id: exp5b-proprio-none-ema
