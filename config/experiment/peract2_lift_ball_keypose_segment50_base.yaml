# Exp 9c: Base on standard-PerAct2 bimanual_lift_ball keyframe rows, reference 50-point keypose-horizon trajectory, no extrinsics noise; 100k.
dataset: Peract2_3dfront_3dwrist
model_type: denoise3d
bimanual: true
backbone: siglip2
text_backbone: null
visual_num_history: 1
proprio_num_history: 3
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: false
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 64
batch_size_val: 64
lr: 0.0001
backbone_lr: 0.0001
wd: 0.005
train_iters: 100000
head_positional_encoding: rope3d
view_align_mode: none
lv2_batch_size: 4
