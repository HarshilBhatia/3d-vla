# 20k-step EMA fine-tune of register-on scratch A 160k (peract2_orbital_vid_pooled_noalign_randhist_scratch); SBRS every 5k on raw and EMA weights.
dataset: OrbitalPeract2
model_type: denoise3d
bimanual: true
backbone: siglip2
text_backbone: null
visual_num_history: 5
proprio_num_history: 3
visual_history_sampling: random
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: true
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 128
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
wd: 0.005
train_iters: 20000
head_positional_encoding: rope3d
view_align_mode: none
view_align_cameras: [0, 1]
layerwise_view_align: true
miscal_cameras: [0, 1]
video_deltam: true
video_deltam_history_register: true
video_deltam_depth: 4
video_deltam_max_cameras: 4
video_deltam_full_image: false
video_deltam_time_embedding: false
use_ema: true
interm_ckpt_interval_steps: 5000
checkpoint_evals:
  - recipe: instructions/eval_plans/video_deltam_checkpoint_ladder_ema20k_raw_v01.json
    method_id: ema20k-regtest_a-raw
    min_step: 5000
    max_step: 20000
  - recipe: instructions/eval_plans/video_deltam_checkpoint_ladder_ema20k_ema_v01.json
    method_id: ema20k-regtest_a-ema
    min_step: 5000
    max_step: 20000
