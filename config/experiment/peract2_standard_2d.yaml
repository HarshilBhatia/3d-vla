# Standard PerAct2 bimanual 2D baseline.
# Uses the published camera set, in zarr order: front, wrist_left, wrist_right.
# The denoise2d policy consumes RGB only; its encoder ignores point-cloud geometry.
dataset: Peract2_3dfront_3dwrist
model_type: denoise2d
bimanual: true
backbone: siglip2
text_backbone: siglip2
visual_num_history: 3
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: image_space
head_positional_encoding: rope3d
view_align_mode: none
layerwise_view_align: false
denoise_timesteps: 5
denoise_model: rectified_flow
keypose_only: true
chunk_size: 1
batch_size: 256
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
train_iters: 350000
num_workers: 16
prefetch_factor: 2
preload: false
use_compile: true
use_ema: false
run_log_dir: peract2_standard_2d
