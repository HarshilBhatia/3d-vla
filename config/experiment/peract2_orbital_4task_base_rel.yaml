# Exp 7d: Base (no history extractor, no delta_M) on 4 tasks for 100k with relative actions.
dataset: OrbitalPeract2
model_type: denoise3d
bimanual: true
train_tasks: [bimanual_handover_item, bimanual_take_tray_out_of_oven, bimanual_dual_push_buttons, bimanual_pick_laptop]
backbone: siglip2
text_backbone: null
visual_num_history: 1
proprio_num_history: 3
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: true
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 128
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
wd: 0.005
train_iters: 100000
head_positional_encoding: rope3d
view_align_mode: none
miscal_cameras: [0, 1]
relative_action: true
checkpoint_evals:
  - recipe: instructions/eval_plans/robustness_ladder_ema_4task_k1_v01.json
    method_id: exp7d-4task-base-rel
    min_step: 40000
