# Exp 7f: exp 2 (pooled Direct delta_M, random history, no time embedding) on 4 tasks (dense per-timestep data) for 120k, absolute actions, 8-step targets.
dataset: OrbitalPeract2
model_type: denoise3d
bimanual: true
# No train_tasks: the dense zarr holds only these 4 tasks, and the filter would copy every row into RAM.
backbone: siglip2
text_backbone: null
visual_num_history: 5
proprio_num_history: 3
visual_history_sampling: random
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: false
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 64
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
wd: 0.005
train_iters: 120000
head_positional_encoding: rope3d
view_align_mode: rope_6d
view_align_cameras: [0, 1]
layerwise_view_align: false
miscal_cameras: [0, 1]
video_deltam: true
video_deltam_depth: 4
video_deltam_max_cameras: 4
video_deltam_full_image: false
video_deltam_time_embedding: false
video_deltam_role: predict_delta_m
visual_history_dense: true
checkpoint_evals:
  - recipe: instructions/eval_plans/robustness_ladder_ema_4task_v01.json
    method_id: exp7f-4task-pooled-direct
    min_step: 40000
