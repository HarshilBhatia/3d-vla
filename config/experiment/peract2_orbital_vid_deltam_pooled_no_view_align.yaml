# Pooled Video history with view alignment off: isolates temporal history from the delta_M correction.
dataset: OrbitalPeract2
model_type: denoise3d
bimanual: true
backbone: siglip2
text_backbone: null
visual_num_history: 5
proprio_num_history: 3
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: true
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 128
batch_size_val: 64
lr: 0.0003
backbone_lr: 0.0003
wd: 0.005
train_iters: 300000
head_positional_encoding: rope3d
view_align_mode: none
view_align_cameras: [0, 1]
layerwise_view_align: true
miscal_cameras: [0, 1]
video_deltam: true
video_deltam_history_register: true
video_deltam_depth: 4
video_deltam_max_cameras: 4
video_deltam_full_image: false
use_ema: false
