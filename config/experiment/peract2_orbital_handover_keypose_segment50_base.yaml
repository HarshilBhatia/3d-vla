# Exp 8e: reference 3DFA keypose-horizon trajectory on handover: keyframe rows only, 50-point spline from this keypose to the next (Euler unwrapped), Base, reference trajectory recipe (lr 1e-4, lv2 4, 100k).
dataset: OrbitalPeract2
model_type: denoise3d
bimanual: true
backbone: siglip2
text_backbone: null
visual_num_history: 1
proprio_num_history: 3
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_shared_attn_layers: 4
fps_subsampling_factor: 5
scene_sampling: fps
keypose_only: false
denoise_timesteps: 5
denoise_model: rectified_flow
batch_size: 64
batch_size_val: 64
lr: 0.0001
backbone_lr: 0.0001
wd: 0.005
train_iters: 100000
head_positional_encoding: rope3d
view_align_mode: none
miscal_cameras: [0, 1]
lv2_batch_size: 4
