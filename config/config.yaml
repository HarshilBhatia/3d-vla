# Single source of truth for train, offline eval, online eval, and analyse_qk.
# Override from CLI: python main.py batch_size=32 eval_only=true
# Switch dataset type: python main.py dataset=peract  (peract2 | peract | peract2_singlecam | peract_twocam)
# Switch data config: python main.py data=two  (single | two | full)  <- which tasks/split
# Switch experiment: python main.py experiment=comrope_2task  (default | comrope_2task | one_task | full | drope)


# === Data / loader (train & offline eval) ===
# data group sets train_data_dir, eval_data_dir, train_instructions, val_instructions (see config/data/*.yaml)
train_data_dir: ''
eval_data_dir: ''
train_instructions: ''
val_instructions: ''
dataset: Peract2_3dfront_3dwrist

# DataLoader: num_workers >= (1+prefetch) per GPU; increase if GPU waits on data. memory_limit = zarr LRU cache (GB).
num_workers: 8
prefetch_factor: 2  # batches to prefetch per worker; try 8 if RAM allows
batch_size: 32
batch_size_val: 32
chunk_size: 1
memory_limit: 8.0
preload: false              # load full dataset into RAM at init (ignores memory_limit)
# Set >0 for Video-DeltaM: every batch has distinct demo/session contexts, but
# each DataLoader worker keeps that diverse set warm for this many batches.
# This is cross-batch locality only; it never packs multiple samples from one
# demo into an update. Requires the zarr to have demo_id.
video_deltam_cache_batches: 0
video_deltam_cache_span: 8  # logical target timesteps kept near each cache anchor
video_deltam_sampler_seed: 0

# === Logging ===
base_log_dir: train_logs
exp_log_dir: exp
run_log_dir: run


# === Train / offline eval ===
# checkpoint: path to .pth for resume or eval_only; null = train from scratch
checkpoint: null
# pretrained_checkpoint: load weights only (no optimizer/iter restore) — use for fine-tuning from a pretrained model.
# New/changed heads start from their random init. Takes priority over checkpoint when both are set.
pretrained_checkpoint: null
# Cadences, in optimizer steps (each fires on `(step + 1) % N == 0`).
val_interval_steps: 4000      # also the wandb.watch gradient-logging interval
ckpt_interval_steps: 100      # rolling last.pth
interm_ckpt_interval_steps: 10000  # kept interm_step_<N>.pth, and what checkpoint_evals trigger on
# Optional checkpoint-triggered online evaluations. Each entry is an independent
# recipe submission; rank 0 submits it immediately after writing a matching
# interm_step_<N>.pth. Example:
# checkpoint_evals:
#   - recipe: instructions/eval_plans/sbrs_checkpoint_ladder_v01.json
#     method_id: view_align
#     min_step: 70000       # optional; defaults to every intermediate checkpoint
#     max_step: 200000      # optional
# The recipe owns task/noise/rollout semantics. No array throttle is applied.
checkpoint_evals: []
# eval_only: true = run validation only (no training); trainer uses run_mode=eval_offline
eval_only: false
lr: 0.0001
backbone_lr: 0.0001
lr_scheduler: constant
wd: 0.005
train_iters: 50000  # total training steps; override per experiment or CLI
# Set train_epochs to derive train_iters from dataset length at startup
# (train_iters = train_epochs * len(train_loader)). Makes runs batch-size invariant
# in samples-seen. If set, overrides train_iters. Leave null to use train_iters directly.
train_epochs: null
use_compile: true  # torch.compile on compute_loss (faster, sometimes unstable)
use_ema: false      # exponential moving average of weights for eval
lv2_batch_size: 1

# === Model: policy type ===
model_type: denoise3d
# bimanual: true for Peract2 bimanual tasks (bimanual_lift_tray, etc.); false for single-arm
bimanual: false
keypose_only: true
pre_tokenize: true
custom_img_size: null
workspace_normalizer_buffer: 0.04

# === Model: encoder ===
# backbone: clip | siglip2 | dino
#   clip    — CLIP RN50 vision + CLIP text (openai/clip-vit-base-patch32)
#   siglip2 — SigLIP2 ViT vision + SigLIP2 text (google/siglip2-base-patch16-256)
#             NOTE: siglip2 requires re-tokenizing the dataset (different vocabulary/max_length)
#   dino    — DINOv2 ViT-B/14 vision (facebook/dinov2-base); text_backbone selects text encoder
#
# text_backbone: null | clip | siglip2
#   null    — defaults to same as backbone (backward compatible)
#   clip    — CLIP text encoder; use with dino backbone (pre_tokenize must be true)
#   siglip2 — SigLIP2 text encoder
backbone: siglip2
text_backbone: null
finetune_backbone: false
finetune_text_encoder: false
fps_subsampling_factor: 5
# fps (feature-distance density; validated, behind the 85.1 result) | fps_xyz
# (XYZ distances) | image_space (uniform per-camera) | none (no subsampling)
scene_sampling: fps

# 2D baseline uses RGB from all four cameras, no point-cloud geometry, no
# rotary RoPE, and additive sinusoidal positional embeddings over image tokens.


# === Model: head ===
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
visual_num_history: 1
# Proprio remains the original Zarr-provided causal K=3 window; Video-DeltaM
# visual history may use a different K.
proprio_num_history: 3
num_shared_attn_layers: 4
# Sparse causal temporal frontend.  When enabled, Video-DeltaM repeats
# same-time cross-camera and causal per-camera attention.
video_deltam: false
video_deltam_depth: 4
video_deltam_max_history: 32
video_deltam_max_cameras: 8
# Give Video-DeltaM the complete encoder token grid for every historical image.
# A learned per-image token reads each grid locally before sparse video attention.
video_deltam_full_image: false
# What the Video-DeltaM stack is for:
#   refine          — it hands the decoder history-refined camera summaries and a
#                     global history register; the head still predicts delta_M
#   predict_delta_m — delta_M is its ONLY output, reused across the whole decoder.
#                     Scene tokens and trajectory queries are left untouched and
#                     the head predicts nothing.
video_deltam_role: refine
relative_action: false
rotation_format: quat_xyzw
denoise_timesteps: 5
denoise_model: rectified_flow


# Head positional encoding (encoder RoPE is separate and always on):
#   rope3d (traj tokens use own predicted XYZ) | rope3d_proprio (anchored at the
#   current gripper) | learned_abs (no RoPE, learned traj PE) | none.
# Only rope3d* give view alignment a basis; the others need view_align_mode=none.
head_positional_encoding: rope3d

# Language conditioning dropout for classifier-free guidance training.
# With prob lang_dropout_prob, replace language tokens with a learned null embedding.
# Set to 0.0 to disable (default). Typical values: 0.1–0.2.
lang_dropout_prob: 0.0


# === View alignment: correcting for camera-extrinsic error ===
#   none | rope_6d (6x6 mixer on the RoPE sin/cos basis) | rope_full (full width)
#   | physical_se3 (predict R,t and transform positions). rope_* need a rope3d*
#   head_positional_encoding.
view_align_mode: none
view_align_cameras: null     # null = every camera; [0,1] = external-only ablation
layerwise_view_align: true   # re-predict per attention block, not once up front
# EE aux head, branching off the shared camera trunk. Requires view alignment.
ee_aux: false
ee_aux_weight: 1.0
ee_aux_cameras: [0, 1]
# === Camera extrinsics: two independent axes ===
# MISCALIBRATION — a persistent per-camera-group error the policy must model.
#   none | group (group reads a fixed matrix per camera group from a noise file)
miscal_mode: none
miscal_group_level: null   # "medium", or a list to draw one level per sample
miscal_group_file: null    # null = instructions/orbital_miscalibration_noise.json
# PERTURBATION NOISE — per-sample jitter, no bias, so extrinsics are correct on
# average. Augmentation, not a calibration error. Composes on top of the above.
perturbation_noise_rot_deg: null
perturbation_noise_trans_m: null
perturbation_noise_fixed_rot_deg: null   # exact magnitude per draw, for sweeps
perturbation_noise_fixed_trans_m: null
# Both axes are restricted to these camera groups (1-based) / cameras (0-based).
miscal_camera_groups: null
miscal_cameras: null





# @_global_ merges group content into root (so train_data_dir, train_instructions, etc. are top-level)
# _self_ sets composition order so this config's values come first, then group configs override.
defaults:
  - _self_
  - data@_global_: single
  - eval@_global_: default
  - logging@_global_: default
  - experiment@_global_: default
  - miscal@_global_: none
