# Single source of truth for train, offline eval, online eval, and analyse_qk.
# Override from CLI: python main.py batch_size=32 eval_only=true
# Switch dataset type: python main.py dataset=peract  (peract2 | peract | peract2_singlecam | peract_twocam)
# Switch data config: python main.py data=two  (single | two | full)  <- which tasks/split
# Switch rope mode: python main.py rope_mode=com  (none | standard | com)
# Switch experiment: python main.py experiment=comrope_2task  (default | comrope_2task | one_task | full | drope)


# === Data / loader (train & offline eval) ===
# data group sets train_data_dir, eval_data_dir, train_instructions, val_instructions (see config/data/*.yaml)
train_data_dir: ''
eval_data_dir: ''
train_instructions: ''
val_instructions: ''
dataset: Peract2_3dfront_3dwrist

# DataLoader: num_workers >= (1+prefetch) per GPU; increase if GPU waits on data. memory_limit = zarr LRU cache (GB).
num_workers: 8
prefetch_factor: 8  # batches to prefetch per worker; try 8 if RAM allows
batch_size: 32
batch_size_val: 32
chunk_size: 1
memory_limit: 8.0
preload: false              # load full dataset into RAM at init (ignores memory_limit)

# === Logging ===
base_log_dir: train_logs
exp_log_dir: exp
run_log_dir: run

# === Benchmarking ===
benchmark: false              # enable per-rank timing/memory logging to benchmark_rank*.txt
benchmark_warmup_steps: 0     # steps to discard before recording (GPU/CUDA warmup)
benchmark_log_freq: 50        # flush interval in steps
benchmark_dummy_data: false   # skip zarr/NFS entirely; use random in-memory tensors
benchmark_profile_steps: 10   # number of steps to capture with torch.profiler (rank 0 only)

# === Wandb ===
use_wandb: true
wandb_project: orbital_runs
wandb_run_name: null
wandb_run_id: null
wandb_save_checkpoints: false
wandb_watch_model: false

# === Train / offline eval ===
# checkpoint: path to .pth for resume or eval_only; null = train from scratch
checkpoint: null
# pretrained_checkpoint: load weights only (no optimizer/iter restore) — use for fine-tuning from a pretrained model.
# New/changed heads start from their random init. Takes priority over checkpoint when both are set.
pretrained_checkpoint: null
val_freq: 4000
last_ckpt_freq: 100
interm_ckpt_freq: 10000
keep_last_k: 3
# eval_only: true = run validation only (no training); trainer uses run_mode=eval_offline
eval_only: false
lr: 0.0001
backbone_lr: 0.0001
lr_scheduler: constant
wd: 0.005
train_iters: 50000  # total training steps; override per experiment or CLI
# Set train_epochs to derive train_iters from dataset length at startup
# (train_iters = train_epochs * len(train_loader)). Makes runs batch-size invariant
# in samples-seen. If set, overrides train_iters. Leave null to use train_iters directly.
train_epochs: null
use_compile: true  # torch.compile on compute_loss (faster, sometimes unstable)
use_ema: false      # exponential moving average of weights for eval
lv2_batch_size: 1

# === Model: policy type ===
model_type: denoise3d
# bimanual: true for Peract2 bimanual tasks (bimanual_lift_tray, etc.); false for single-arm
bimanual: false
keypose_only: true
pre_tokenize: true
custom_img_size: null
workspace_normalizer_buffer: 0.04

# === Model: encoder ===
# backbone: clip | siglip2 | dino
#   clip    — CLIP RN50 vision + CLIP text (openai/clip-vit-base-patch32)
#   siglip2 — SigLIP2 ViT vision + SigLIP2 text (google/siglip2-base-patch16-256)
#             NOTE: siglip2 requires re-tokenizing the dataset (different vocabulary/max_length)
#   dino    — DINOv2 ViT-B/14 vision (facebook/dinov2-base); text_backbone selects text encoder
#
# text_backbone: null | clip | siglip2
#   null    — defaults to same as backbone (backward compatible)
#   clip    — CLIP text encoder; use with dino backbone (pre_tokenize must be true)
#   siglip2 — SigLIP2 text encoder
backbone: siglip2
text_backbone: null
finetune_backbone: false
finetune_text_encoder: false
fps_subsampling_factor: 5
skip_fps: false                   # if true, skip FPS subsampling and use all image tokens as scene tokens
position_based_sampling: false   # if true, density sampling uses 3D XYZ distances instead of feature distances
image_space_sampling: true      # if true, uniformly sample tokens per-camera in image space instead of density-based sampling
use_proprio_rope: false           # if true, trajectory tokens use current gripper XYZ for RoPE instead of their own noisy positions



# === Online eval (evaluate_policy.py) ===
task: null
max_tries: 10
max_steps: 25
headless: false
collision_checking: false
seed: 0
data_dir: demos
image_size: "256,256"
output_file: eval.json
fp16: false
prediction_len: 1
save_trajectory: false
save_video: false
cfg_scale: null


# === Model: head ===
embedding_dim: 120
num_attn_heads: 6
num_vis_instr_attn_layers: 3
num_history: 1
num_shared_attn_layers: 4
relative_action: false
rotation_format: quat_xyzw
denoise_timesteps: 5
denoise_model: rectified_flow


traj_scene_rope: true
use_learned_abs_pe: false  # if true, replaces 3D RoPE with a learned per-index abs PE on traj tokens only

# Language conditioning dropout for classifier-free guidance training.
# With prob lang_dropout_prob, replace language tokens with a learned null embedding.
# Set to 0.0 to disable (default). Typical values: 0.1–0.2.
lang_dropout_prob: 0.0


predict_extrinsics: false
extrinsics_prediction_mode: delta_m  # 'rt' = R,T (6D); 'delta_m' = 6x6 matrix
dynamic_rope_from_camtoken: true  # re-predict delta_M/(R,T) from cam-token after each SA/CA block
# EE aux prediction head: shared camera_trunk branches into an EE XYZ predictor (requires predict_extrinsics=true)
predict_ee_aux: false
lambda_aux: 1.0        # weight of EE aux loss relative to flow loss
ee_aux_cam_ids: [0, 1] # camera indices (into per_img_feats) to predict EE from
# random miscalibration (training + eval): random direction, magnitude sampled uniformly in [0, max].
miscal_max_angle_deg: null
miscal_max_translation_m: null
# per-group constant miscalibration: pre-sample K fixed noise matrices (one per camera group).
# Requires miscal_max_angle_deg + miscal_max_translation_m to define the sampling range.
# camera_group (1-based uint8) must be present in the zarr (orbital datasets).
# file-based per-group noise: null | "small" | "medium" | "large"
# loads from instructions/orbital_miscalibration_noise.json (generated by scripts/generate_orbital_miscal_noise.py).
# camera_group (1-based uint8) must be present in the zarr (orbital datasets).
# Can be combined with miscal_max_angle_deg / miscal_max_translation_m to add random noise on top of the fixed base.
orbital_miscal_noise_level: null
# per-task constant miscalibration: one fixed noise matrix per task (same magnitude as per-group, different values).
# Mutually exclusive with orbital_miscal_noise_level. null | "small" | "medium" | "large"
# per-group multi-level miscalibration: randomly draw one level per batch sample from the list.
# Mutually exclusive with the other orbital_miscal options. null | [small, medium, large]
orbital_miscal_noise_levels: null
# co-training with mixed miscal groups: some groups receive fixed noise, others see clean extrinsics.
# cotrain_miscal_group_ids: 1-based list of group IDs that get noise (e.g. [1, 2]); null = disabled.
# cotrain_miscal_level: noise level for those groups — null | "small" | "medium" | "large".
# cotrain_miscal_levels: list of levels sampled uniformly per-sample (e.g. [small, medium, large]).
# Exactly one of cotrain_miscal_level / cotrain_miscal_levels must be set when group_ids is set.
# Mutually exclusive with the other orbital_miscal options.
cotrain_miscal_group_ids: null
cotrain_miscal_level: null
cotrain_miscal_levels: null
# noise curriculum: linearly ramp random miscal noise from 0 to max over training
noise_curriculum: false
noise_curriculum_warmup_frac: 1.0  # fraction of training steps over which noise ramps to max (1.0 = full training)
# eval_use_depth2cloud: route peract online eval through depth+extrinsics→PCD (consistent with training).
# Required for miscalibration eval; also set true for clean train/eval alignment.
eval_use_depth2cloud: false
# Orbital camera eval settings (used when dataset=OrbitalWrist)
cameras_file: null                    # path to orbital_cameras_grouped.json
task_group_mapping_file: null         # path to task_group_mapping.json (eval uses all trained groups)
camera_groups: null                   # override which groups to eval, e.g. "G1" or "G1,G2"; null = use all from mapping
spawn_camera_group: null              # if set, always spawn this group's cameras regardless of demo group, e.g. "G3"
fov_deg: 60.0                         # FOV in degrees for orbital VisionSensors

# RoPE: traj_scene_rope comes from config/rope_mode/<name>.yaml



# === Recursive Set Transformer Encoder ===
# Upstream feature refinement via per-camera registers + time-pooling + delta_M prediction.
# When enabled, rgb3d_feats are refined and delta_M is pre-computed before the TransformerHead.
use_recursive_set_encoder: false
recursive_set_encoder_num_layers: 2
recursive_set_encoder_ncam: 3   # must match the number of cameras in the dataset

rope_type: normal
rope_schedule_type: null
rope_schedule_start_k: null
rope_schedule_end_k: null
rope_schedule_steps: null



# @_global_ merges group content into root (so train_data_dir, train_instructions, etc. are top-level)
# _self_ sets composition order so this config's values come first, then group configs override.
defaults:
  - _self_
  - data@_global_: single
  - experiment@_global_: default