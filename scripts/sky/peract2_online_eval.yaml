# Online PerAct2 evaluation of a trained 3DFA checkpoint — one task per job.
#
# Launch one managed job per task (13 tasks total) so a CoppeliaSim crash costs
# one task instead of the whole sweep:
#
#   for t in bimanual_push_box bimanual_lift_ball ...; do
#     sky jobs launch -n "hb-3dfa-eval-$t" -d --infra k8s/sky-us-east-1 \
#       --env PREEMPTIBLE=1 --env TASK="$t" scripts/sky/peract2_online_eval.yaml
#   done
#
# FAR L40S capacity is the karpenter-backed k8s contexts (sky-us-east-1 /
# sky-us-east-2), not raw EC2, and lives in the `default` sky workspace — the
# `ext-eval` workspace has no AWS or L40S enabled, so launches need
# SKYPILOT_WORKSPACE=default (`workspace` is not a task-YAML field). Fall back to
# k8s/sky-us-east-2 if us-east-1 l40s-default is contended.
#
# The container image carries CoppeliaSim 4.1 + the repo's PyRep/RLBench forks.
# The bimanual RLBench fork (BimanualMoveArmThenGripper) lives at /opt/src/RLBench2
# and is required for every bimanual_* task.
#
# Checkpoint and test seeds are pulled from S3 because AWS nodes cannot reach the
# ll-sea NFS where training wrote them.
name: hb-3dfa-peract2-eval

resources:
  accelerators: L40S:1
  cloud: kubernetes
  cpus: 8+
  memory: 32+
  disk_size: 128
  image_id: docker:241533154612.dkr.ecr.us-east-1.amazonaws.com/rfm-h-eval-job:hb-3dfa-peract2-20260811
  # Recover from preemption, but do NOT retry on error: an erroring eval used to
  # be relaunched on a fresh pod, destroying the log that explained the failure.
  job_recovery:
    strategy: EAGER_NEXT_REGION
    max_restarts_on_errors: 0

num_nodes: 1

# The image declares /workspace/3d_flowmatch_actor as a VOLUME and ships it
# EMPTY — the repo is expected to be bind-mounted at runtime, so a cloud job has
# to bring its own copy. .skyignore keeps this upload to ~10 MB by excluding the
# PyRep/RLBench forks (already installed in the image) plus data and checkpoints.
workdir: .

envs:
  # Required for kueue admission; omitting it leaves the job PENDING.
  PREEMPTIBLE: "1"
  TASK: bimanual_push_box
  RUN_NAME: peract2_base_b200
  CKPT_S3: s3://far-research-internal/harsvbha/3dfa/eval/ckpt/peract2_base_b200_last.pth
  SEEDS_S3: s3://far-research-internal/harsvbha/3dfa/eval/peract2_test
  OUT_S3: s3://far-research-internal/harsvbha/3dfa/eval/results/peract2_base_b200
  # Episodes per variation. The staged test set holds 100 seeds per task; 25 is
  # the benchmark convention and keeps a task inside a single job's runtime.
  NUM_DEMOS: "25"
  # Rollout videos are the only way to tell a policy failure from a harness
  # failure (wrong camera, wrong scene) when a success rate comes back at zero.
  SAVE_VIDEO: "true"

run: |
  set -euo pipefail
  export AWS_REGION=us-east-1 AWS_DEFAULT_REGION=us-east-1

  # SkyPilot puts the uploaded workdir here; the image's own
  # /workspace/3d_flowmatch_actor is an empty VOLUME.
  REPO=$(pwd)

  # CoppeliaSim needs its own libs on the loader path and must NOT get
  # QT_QPA_PLATFORM=offscreen — the bundled xcb plugin talks to Xvfb instead.
  export COPPELIASIM_ROOT=/opt/CoppeliaSim_Edu_V4_1_0_Ubuntu20_04
  export LD_LIBRARY_PATH="${COPPELIASIM_ROOT}:${LD_LIBRARY_PATH:-}"
  export QT_QPA_PLATFORM_PLUGIN_PATH="${COPPELIASIM_ROOT}"
  unset QT_QPA_PLATFORM || true
  # Set outright rather than prepended: the image bakes PYTHONPATH and REPO_DIR
  # pointing at the empty /workspace volume, which would otherwise shadow the
  # uploaded source.
  export PYTHONPATH="$REPO"
  export REPO_DIR="$REPO"
  export XDG_RUNTIME_DIR=/tmp/runtime-root
  mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

  python -c "import torch; assert torch.cuda.is_available(), 'no CUDA'; print('gpu:', torch.cuda.get_device_name(0))"
  python -c "from rlbench.action_modes.action_mode import BimanualMoveArmThenGripper; print('bimanual rlbench OK')"

  # The image ships neither the AWS CLI nor boto3, so S3 transfers go through
  # scripts/eval/s3_transfer.py with boto3 installed here.
  uv pip install --python "$(which python)" --quiet boto3
  S3=scripts/eval/s3_transfer.py

  LOCAL=/tmp/3dfa_eval
  mkdir -p "$LOCAL/seeds" "$LOCAL/out"
  python "$S3" down "$CKPT_S3" "$LOCAL/last.pth"
  # Only this task's seeds — the full staged set is 1.2 GB across 13 tasks.
  python "$S3" sync-down "$SEEDS_S3/$TASK" "$LOCAL/seeds/$TASK"

  OUT="$LOCAL/out/results_${TASK}.json"

  # Arch flags are intentionally absent: evaluate_policy.py overlays the
  # checkpoint's saved training config onto args, so the model is rebuilt exactly
  # as trained. Only genuine eval-runtime values are passed here.
  # Tee to a file and upload it even on failure: a managed job's pod is recycled
  # on exit, so an un-exported log is unrecoverable.
  EVAL_LOG="$LOCAL/out/${TASK}.log"
  rc=0
  xvfb-run -a --server-args="-screen 0 1280x1024x24 +extension GLX +render" \
    python online_evaluation_rlbench/evaluate_policy.py \
      data=full \
      bimanual=true \
      data_dir="$LOCAL/seeds" \
      checkpoint="$LOCAL/last.pth" \
      output_file="$OUT" \
      task="$TASK" \
      num_demos="$NUM_DEMOS" \
      max_tries=1 \
      headless=true \
      save_video="$SAVE_VIDEO" 2>&1 | tee "$EVAL_LOG" || rc=$?
  python "$S3" up "$EVAL_LOG" "$OUT_S3/logs/${TASK}.log" || true
  if [ "$rc" -ne 0 ] || [ ! -f "$OUT" ]; then
    echo "EVAL_FAILED $TASK rc=$rc — log at $OUT_S3/logs/${TASK}.log" >&2
    exit 1
  fi

  python "$S3" up "$OUT" "$OUT_S3/${TASK}.json"
  # The progress file is the only record of which demos completed, so keep it
  # even on a clean run.
  PROGRESS="${OUT%.json}.progress.json"
  [ -f "$PROGRESS" ] && python "$S3" up "$PROGRESS" "$OUT_S3/${TASK}.progress.json"
  if [ "$SAVE_VIDEO" = "true" ]; then
    python "$S3" sync-up "$LOCAL/out" "$OUT_S3/videos/$TASK"
  fi
  echo "EVAL_DONE $TASK"
