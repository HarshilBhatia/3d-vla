# Real 3DFA multi-node training: 2 nodes x 1 GPU, PerAct2 orbital 2d.
partition: all
nodes: 2
gpus_per_node: 1
cpus_per_task: 8
mem_per_cpu: 10G
walltime: "00:40:00"

# A6000 is fastest (111 ms/step) and A5000 the largest pool (139 ms/step).
# Turing cards are excluded: rtx2080ti does not run at all, rtx6000 is 4.25x.
constraints:
  - A6000
  - A5000

pend_timeout_seconds: 600
max_requeues_per_constraint: 2

# NFS, not /tmp -- /tmp is node-local on grogu and a requeue would lose it.
# NOTE: base.py writes last.pth to its own log_dir
# (base_log_dir/exp_log_dir/run_log_dir), NOT here. Point ckpt_dir at that
# same filesystem so preflight's writability and free-space checks test the
# disk the checkpoints really use. This dir still holds the preempt sentinel
# and the mislabelled-node record.
ckpt_dir: /home/harshilb/3dfa_unified/train_logs/MultiNode
ckpt_interval_seconds: 300
signal_lead_seconds: 120

# Reject an allocation where any node has more than this fraction of its GPUs
# taken by other jobs. Measured: a node at 5/8 busy cost ~10% step time, and a
# DDP step runs at the speed of its slowest rank, so one noisy neighbour taxes
# the whole job -- more than the 1-4% that multi-node communication costs.
# 1.0 disables the check (warn only). Load is transient, so a rejection just
# makes the launcher retry for a different allocation.
max_node_load: 0.75
min_busbw: 3.5          # 7.3 idle / 4.1 contended / 1.3 on sockets
min_free_gb: 20.0
allow_heterogeneous: false

# main.py runs directly under srun: job.sbatch already supplies RANK,
# LOCAL_RANK, WORLD_SIZE, MASTER_ADDR/PORT, and main.py uses init_method=env://.
# PYTHONPATH is explicit because `bash -lc` may not leave us in the repo root.
train_cmd: >-
  bash -lc 'source /home/harshilb/miniconda3/etc/profile.d/conda.sh
  && conda activate 3dfa
  && cd /home/harshilb/3dfa_unified
  && export PYTHONPATH=/home/harshilb/3dfa_unified:$PYTHONPATH BLOSC_NTHREADS=1
  && exec python main.py
  data=orbital_peract2_nfs experiment=peract2_orbital_2d dataset=OrbitalPeract2
  train_data_dir=/grogu/datasets/hbhatia/3dfa_egress_extracted/3dfa_egress_20260820/datasets/orbital_peract2/zarr/train.zarr
  eval_data_dir=/grogu/datasets/hbhatia/3dfa_egress_extracted/3dfa_egress_20260820/datasets/orbital_peract2/zarr/val.zarr
  exp_log_dir=MultiNode run_log_dir=peract2_2node seed=1234
  batch_size=16 num_workers=6 prefetch_factor=2
  train_iters=600 ckpt_interval_steps=100 val_interval_steps=1000000
  interm_ckpt_interval_steps=1000000
  checkpoint=/home/harshilb/3dfa_unified/train_logs/MultiNode/peract2_2node/last.pth
  benchmark=true benchmark_warmup_steps=40 benchmark_log_freq=20 benchmark_profile_steps=0'

log_dir: logs/multinode
runlog: logs/multinode/runs.jsonl
env:
  PYTHONUNBUFFERED: "1"
